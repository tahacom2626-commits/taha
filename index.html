<!doctype html>
<html lang="fa" dir="rtl">
<head>

  <style>
    :root{color-scheme:dark;--cyan:#35e7ff;--violet:#a855f7;--muted:#a7a7b5}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px 18px;font-family:Tahoma,Arial,sans-serif;color:#fff;overflow-x:hidden;background:radial-gradient(ellipse at 15% 15%,rgba(53,231,255,.13),transparent 34%),radial-gradient(ellipse at 85% 80%,rgba(168,85,247,.16),transparent 38%),#08080d}
    .card{width:min(100%,460px);padding:36px 24px 28px;text-align:center;border:1px solid rgba(255,255,255,.12);border-radius:30px;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.025));box-shadow:0 0 55px rgba(53,231,255,.08),0 0 80px rgba(168,85,247,.07),inset 0 1px rgba(255,255,255,.08);backdrop-filter:blur(18px)}
    .avatar{width:88px;height:88px;margin:0 auto 18px;border-radius:27px;display:grid;place-items:center;font-size:34px;font-weight:800;letter-spacing:2px;background:linear-gradient(135deg,rgba(53,231,255,.22),rgba(168,85,247,.25));border:1px solid rgba(255,255,255,.2);box-shadow:0 0 28px rgba(53,231,255,.2),inset 0 0 20px rgba(168,85,247,.16)}
    h1{margin:0;font-size:32px;letter-spacing:5px;text-shadow:0 0 18px rgba(53,231,255,.65)}
    .sub{color:var(--muted);margin:12px 0 26px;font-size:14px}
    .links{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}
    .link{min-height:108px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:20px;text-decoration:none;color:#fff;font-size:14px;font-weight:700;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.11);transition:transform .2s,box-shadow .2s,border-color .2s}
    .link:hover,.link:focus-visible{transform:translateY(-4px);outline:none;border-color:var(--cyan);box-shadow:0 0 22px rgba(53,231,255,.18)}
    .icon{width:42px;height:42px;display:grid;place-items:center;border-radius:14px}
    .icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .telegram .icon{color:#35c9ff;background:rgba(53,201,255,.13)}
    .instagram .icon{color:#ff72bd;background:rgba(255,75,160,.13)}
    .email .icon{color:#b58aff;background:rgba(168,85,247,.15)}
    .phone .icon{color:#66f0a5;background:rgba(58,220,133,.13)}
    .payment{margin-top:22px;padding:20px 16px;border-radius:21px;text-align:right;background:linear-gradient(135deg,rgba(53,231,255,.075),rgba(168,85,247,.09));border:1px solid rgba(255,255,255,.13)}
    .payment h2{font-size:17px;margin:0 0 16px}
    .detail{display:flex;justify-content:space-between;gap:12px;margin:11px 0;color:var(--muted);font-size:13px}
    .detail strong{color:#fff;font-weight:600;text-align:left;direction:ltr;overflow-wrap:anywhere}
    .card-number{direction:ltr;unicode-bidi:plaintext;letter-spacing:1px;font-size:16px}
    .copy{width:100%;margin-top:10px;padding:12px;border:1px solid rgba(53,231,255,.35);border-radius:13px;background:rgba(53,231,255,.12);color:#dffbff;font:700 13px Tahoma,Arial;cursor:pointer}
    .copy:active{transform:scale(.98)}
    .hint{color:#858594;font-size:11px;margin:20px 0 0;line-height:1.9}
    .footer{margin-top:20px;color:#555563;font-size:11px;letter-spacing:2px}
    @media(max-width:360px){.card{padding:29px 16px 22px}.links{gap:10px}.link{min-height:100px}.detail{font-size:12px}}
  </style>
</head>
<body>
<main class="card">

    </a>

    </a>

  <section class="payment" aria-label="اطلاعات پرداخت">

    <div class="detail"><span>به نام</span><strong dir="rtl">اکبر ملکی</strong></div>

</main>
<script>
async function copyCard(){
  const number='5047061660904133';
  const button=document.querySelector('.copy');
  try{
    await navigator.clipboard.writeText(number);
    button.textContent='شماره کارت کپی شد ✓';
  }catch(e){
    const field=document.createElement('textarea');
    field.value=number;document.body.appendChild(field);field.select();
    document.execCommand('copy');field.remove();
    button.textContent='شماره کارت کپی شد ✓';
  }
  setTimeout(()=>button.textContent='کپی شماره کارت',1800);
}
</script>
